[project]
name = "victorious-api"
version = "0.1.0"
description = "Project Victorious — AI-native Software Engineering Organization (API)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# BLE (blind except) and S (bandit security) are enabled deliberately: broad
# excepts and unguarded asserts are exactly the shortcuts that creep in under
# deadline pressure. Where one is genuinely correct it carries an explaining noqa.
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "BLE", "S"]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test suite.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
